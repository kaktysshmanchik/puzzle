<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The lore</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/lore-message.css">
</head>
<body>
<main class="page">
    <a class="dossier-back" href="index.html">← Back to index</a>
    <h1>The lore</h1>

    <section class="lore-message-puzzle" data-message-rebuild aria-label="Message reconstruction">
        <p class="lore-puzzle-quote">A long time ago in a galaxy far, far away...</p>
        <div class="message-rebuild-board">
            <div class="message-piece-pile" data-message-pile aria-label="Shuffled message fragments"></div>
            <button class="message-win-card" data-message-card hidden type="button" aria-label="Turn over reward card">
                <span class="message-win-card-inner">
                    <span class="message-win-card-face message-win-card-front"></span>
                    <span class="message-win-card-face message-win-card-back"><span>[UPDATE]</span><span>tries: <strong data-message-tries>0</strong></span></span>
                </span>
            </button>
            <div class="message-order-grid" data-message-grid aria-label="Message reconstruction slots"></div>
        </div>
    </section>

    <section class="scrabble-word-puzzle" aria-label="Word lock">
        <p class="lore-puzzle-quote">Where words are spent, they are seldom spent in vain.</p>
        <div class="scrabble-word-grid" data-scrabble-grid aria-label="Five letter word grid">
            <div class="scrabble-word-slot" data-scrabble-slot="0" data-slot-number="1"></div><div class="scrabble-word-slot" data-scrabble-slot="1" data-slot-number="2"></div><div class="scrabble-word-slot" data-scrabble-slot="2" data-slot-number="3"></div><div class="scrabble-word-slot" data-scrabble-slot="3" data-slot-number="4"></div><div class="scrabble-word-slot" data-scrabble-slot="4" data-slot-number="5"></div>
        </div>
        <div class="scrabble-reward" data-scrabble-reward hidden><span>PLAYER TWO NOTES // PASSCODE</span><strong data-scrabble-passcode></strong><small>Word lock accepted.</small></div>
    </section>
</main>
<script src="js/scrabble.js"></script><script src="js/lore-message.js"></script>
</body>
</html>
